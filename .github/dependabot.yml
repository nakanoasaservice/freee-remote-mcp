# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # npm packages (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    # Update the pinned Vite+ toolchain and setup-vp version together.
    ignore:
      - dependency-name: "vite"
      - dependency-name: "vite-plus"
      - dependency-name: "vitest"
      - dependency-name: "@voidzero-dev/vite-plus-core"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
